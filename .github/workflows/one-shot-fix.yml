name: One-shot TypeScript fix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: ${{ !contains(github.event.head_commit.message, 'fix: normalize optional timestamp') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix optional timestamp type
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('app/page.tsx')
          s = p.read_text(encoding='utf-8')
          old = "const dateText=(v:string|null)=>"
          new = "const dateText=(v:string|null|undefined)=>"
          if old not in s:
              raise SystemExit('target text not found')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Commit fix and remove one-shot workflow
        run: |
          rm .github/workflows/one-shot-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/page.tsx .github/workflows/one-shot-fix.yml
          git commit -m "fix: normalize optional timestamp"
          git push
